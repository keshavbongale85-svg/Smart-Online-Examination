services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: smart_exam
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      NODE_ENV: "development"
      CLIENT_URL: "http://localhost:5173"
      MONGO_URI: "mongodb://mongo:27017/smart_exam"
      JWT_SECRET: "docker-dev-secret-change-me"
      JWT_EXPIRE: "7d"
      JWT_COOKIE_DAYS: "7"
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:5000/api"
      VITE_SOCKET_URL: "http://localhost:5000"
      VITE_PROXY_TARGET: "http://backend:5000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  mongo_data:
